# 训练配置（四段解码器约束微调）

本文件记录最终权重 `checkpoints/best_model.pth` 的完整训练配方。
四段串联，每段的父模型是上一段的输出。

## 模型

| 项 | 值 |
|---|---|
| 结构 | DeepKANSegSwin（Swin-B 编码器 + DFR 深度特征精炼 + GLKAN 解码器） |
| 总参数 | 97.81 M |
| 编码器 | Swin-B，timm `tu-swin_base_patch4_window7_224`，ImageNet-1k |
| 可训练部分 | 仅解码器 2.67 M；编码器 86.74 M 与 DFR 8.47 M 全程冻结 |
| 输入分辨率 | 1024 × 1024（原生，不缩放） |
| 输出类别 | 9（0 = 忽略，1–8 为地类） |
| KAN 基函数 | grid_size = 5，spline_order = 3（论文 Table IX 的最优设置，未改动） |

## 四段训练

| 阶段 | 父权重 | 步数 | batch | 累计 crop | val500 |
|---|---|---|---|---|---|---|
| R0 | 第二阶段链终点 | — | — | — | 0.753938 |  |
| v2 | R0 | 1600 | 4 | 6400 | 0.758314 |  |
| r2 | v2 | 3200 | 4 | 12800 | 0.761884 | 未归档 |
| r3 | r2 | 6400 | 4 | 25600 | 0.764587 |  |
| **sw** | **r3** | **12800** | **4** | **51200** | **0.766757** | **** |

## 超参

| 参数 | 值 |
|---|---|
| 优化器 | AdamW |
| 学习率 | 1e-5，余弦退火至 1e-6（`T_max = steps`） |
| 权重衰减 | 0.01 |
| 梯度裁剪 | 1.0（按范数，只对可训参数） |
| 精度 | bfloat16 自动混合 |
| EMA | decay 0.99，仅解码器参数；**BN buffer 不参与 EMA**，导出时一律沿用父权重 |
| 随机种子 | 42 |
| 损失 | `0.20 × L_sup + 1.0 × L_KL` |
| `L_sup` | 边界加权 CE + Dice + 0.5·Lovász |
| 边界权重 | 5×5 膨胀/腐蚀差集处 3.0，其余 1.0 |
| 类别权重 | `[0.40, 0.49, 0.65, 0.94, 1.66, 0.37, 0.90, 2.59]` |
| `L_KL` | 父解码器在 256×256 上的软预测，通道 1–8，仅非忽略像素 |
| 数据顺序 | 6496 张按 `random.Random(42).shuffle` 固定打乱后顺序消费 |
| 增强 | 仅几何：水平翻转 0.5、垂直翻转 0.5、90° 旋转 0.25 |

## 复现命令

```bash
# 第 1 段（v2）
python train.py --images $DATA/train/images --masks $DATA/train/masks \
                --parent $DATA/R0.pth --out v2.pth --steps 1600 --batch 4

# 第 2 段（r2）
python train.py --images $DATA/train/images --masks $DATA/train/masks \
                --parent v2.pth --out r2.pth --steps 3200 --batch 4

# 第 3 段（r3）
python train.py --images $DATA/train/images --masks $DATA/train/masks \
                --parent r2.pth --out r3.pth --steps 6400 --batch 4

# 第 4 段（最终输出权重）
python train.py --images $DATA/train/images --masks $DATA/train/masks \
                --parent r3.pth --out best_model.pth --steps 12800 --batch 4
```

其中 `$DATA/R0.pth` 是第二阶段阶段的最终权重（`ckpt_kan_s2_i600_c1_alpha075_20261003.pth`，
SHA256 `60c499b9…`），其完整训练链条见第二阶段交付包中的 `REPRODUCE_FROM_SCRATCH.md`。

